<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .msg { font-size: 14px; }
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.5; rx: 8; }
      .line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .arrow { stroke: #1f2937; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; rx: 8; }
    </style>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="title">PowerZone Short Sequence Diagram</text>

  <rect x="60" y="70" width="130" height="42" class="box"/>
  <text x="125" y="97" text-anchor="middle" class="label">User</text>

  <rect x="290" y="70" width="150" height="42" class="box"/>
  <text x="365" y="97" text-anchor="middle" class="label">Website</text>

  <rect x="535" y="70" width="150" height="42" class="box"/>
  <text x="610" y="97" text-anchor="middle" class="label">Supabase</text>

  <rect x="770" y="70" width="130" height="42" class="box"/>
  <text x="835" y="97" text-anchor="middle" class="label">ML API</text>

  <line x1="125" y1="112" x2="125" y2="575" class="line"/>
  <line x1="365" y1="112" x2="365" y2="575" class="line"/>
  <line x1="610" y1="112" x2="610" y2="575" class="line"/>
  <line x1="835" y1="112" x2="835" y2="575" class="line"/>

  <path d="M125 150 H365" class="arrow"/>
  <text x="245" y="140" text-anchor="middle" class="msg">Open PowerZone</text>

  <path d="M365 205 H610" class="arrow"/>
  <text x="487" y="195" text-anchor="middle" class="msg">Check / login / register</text>

  <path d="M610 260 H365" class="return"/>
  <text x="487" y="250" text-anchor="middle" class="msg">Auth status</text>

  <path d="M125 320 H365" class="arrow"/>
  <text x="245" y="310" text-anchor="middle" class="msg">Use dashboard</text>

  <path d="M365 375 H125" class="return"/>
  <text x="245" y="365" text-anchor="middle" class="msg">Show fitness data</text>

  <path d="M125 435 H365" class="arrow"/>
  <text x="245" y="425" text-anchor="middle" class="msg">Upload food image</text>

  <path d="M365 490 H835" class="arrow"/>
  <text x="600" y="480" text-anchor="middle" class="msg">Scan food</text>

  <path d="M835 535 H365" class="return"/>
  <text x="600" y="525" text-anchor="middle" class="msg">Calories + prediction</text>

  <path d="M365 575 H125" class="return"/>
  <text x="245" y="565" text-anchor="middle" class="msg">Show result</text>
</svg>
