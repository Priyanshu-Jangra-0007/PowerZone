<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerZone Register</title>
    <link rel="stylesheet" href="auth-pages.css?v=1">
    <link rel="stylesheet" href="theme.css?v=1">
</head>
<body data-auth-page="register">
    <main class="auth-shell">
        <div class="auth-panel">
            <a class="logo-link" href="index.html">
                <img src="images/logo.png" alt="PowerZone Logo">
            </a>

            <div class="auth-headline">
                <p class="kicker">START YOUR</p>
                <h1>POWERZONE</h1>
                <p class="kicker tail">JOURNEY</p>
            </div>

            <section class="auth-box">
                <h2>Create Account</h2>
                <p id="auth-status" class="auth-status" aria-live="polite"></p>
                <form id="register-form" class="auth-form" novalidate>
                    <label>Full Name
                        <input type="text" name="fullName" autocomplete="name" placeholder="Your full name" required>
                    </label>
                    <label>Email
                        <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                    </label>
                    <label>Password
                        <input type="password" name="password" autocomplete="new-password" placeholder="Min 8 characters" minlength="8" required>
                    </label>
                    <label>Confirm Password
                        <input type="password" name="confirmPassword" autocomplete="new-password" placeholder="Repeat password" minlength="8" required>
                    </label>
                    <label class="terms">
                        <input type="checkbox" name="terms" required>
                        I agree to Terms and Privacy Policy.
                    </label>
                    <div class="btn-row">
                        <button type="submit" class="btn-red">Create Account</button>
                        <a class="btn-light" href="login.html">Back To Login</a>
                    </div>
                </form>
            </section>
        </div>
        <div class="hero-side"></div>
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <a class="site-footer-brand" href="index.html">
                <img src="images/logo.png" alt="PowerZone Logo">
                <span>PowerZone</span>
            </a>
            <div class="site-footer-links">
                <a href="about.html">About</a>
                <a href="gym-directory.html">Gyms</a>
                <a href="health-stream.html">AI Food Scanner</a>
                <a href="franchise.html">Franchise</a>
            </div>
            <p class="site-footer-copy">PowerZone. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-pages.js"></script>
    <script src="theme.js"></script>
</body>
</html>
